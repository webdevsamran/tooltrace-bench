[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tooltrace-bench"
version = "0.3.0"
description = "Vendor-neutral, reproducible benchmarking of AI agents across coding, tool use, file operations, multi-step workflows, failure recovery, latency, cost and reliability."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "webdevsamran", email = "webdevsamran@users.noreply.github.com" }]
maintainers = [{ name = "webdevsamran", email = "webdevsamran@users.noreply.github.com" }]
keywords = [
  "ai-agents", "benchmark", "evaluation", "llm", "tool-use",
  "reliability", "reproducibility", "tracing", "sandbox",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<16",
  "jsonschema>=4.21,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
docker = ["docker>=7.0,<8"]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5.0,<8",
  "hypothesis>=6.100,<7",
  "mypy>=1.10,<3",
  "ruff>=0.4,<1",
  "types-PyYAML>=6.0",
  # so scripts/wheel_check.py can build a wheel offline (--no-isolation)
  "build>=1.2,<2",
  "hatchling>=1.24,<2",
]

[project.scripts]
tooltrace = "tooltrace.cli.main:main"

[project.urls]
Homepage = "https://github.com/webdevsamran/tooltrace-bench"
Repository = "https://github.com/webdevsamran/tooltrace-bench"
Issues = "https://github.com/webdevsamran/tooltrace-bench/issues"
Documentation = "https://github.com/webdevsamran/tooltrace-bench/tree/main/docs"

# Plugin discovery groups. Third-party packages may register:
#   tooltrace.agents       -> AgentAdapter implementations
#   tooltrace.tools        -> Tool implementations
#   tooltrace.task_packs   -> bundled task pack directories
#   tooltrace.scorers      -> deterministic scorers
#   tooltrace.reporters    -> report exporters
#   tooltrace.sandboxes    -> sandbox providers
[project.entry-points."tooltrace.agents"]
subprocess = "tooltrace.agents.subprocess:SubprocessAgent"
openai_compat = "tooltrace.agents.openai_compat:OpenAICompatAgent"
scripted = "tooltrace.agents.scripted:ScriptedAgent"
streaming = "tooltrace.agents.streaming:StreamingAgent"

[project.entry-points."tooltrace.sandboxes"]
local = "tooltrace.sandbox.local:TempWorkspaceSandbox"
docker = "tooltrace.sandbox.docker_sandbox:DockerSandbox"

[project.entry-points."tooltrace.tools"]
read_file = "tooltrace.tools.files:ReadFileTool"
write_file = "tooltrace.tools.files:WriteFileTool"
patch_file = "tooltrace.tools.files:PatchFileTool"
list_directory = "tooltrace.tools.files:ListDirectoryTool"
search_text = "tooltrace.tools.files:SearchTextTool"
shell = "tooltrace.tools.process:ShellTool"
git = "tooltrace.tools.process:GitTool"
calculator = "tooltrace.tools.compute:CalculatorTool"
test_runner = "tooltrace.tools.process:TestRunnerTool"
http = "tooltrace.tools.net:HttpTool"

[project.entry-points."tooltrace.task_packs"]
builtin = "tooltrace.tasks._packs_entry:builtin"

[project.entry-points."tooltrace.scorers"]
file_exists = "tooltrace.scoring.builtin:_file_exists"
file_not_exists = "tooltrace.scoring.builtin:_file_not_exists"
file_contains = "tooltrace.scoring.builtin:_file_contains"
file_not_contains = "tooltrace.scoring.builtin:_file_not_contains"
json_schema = "tooltrace.scoring.builtin:_json_schema"
json_equals = "tooltrace.scoring.builtin:_json_equals"
csv_equals = "tooltrace.scoring.builtin:_csv_equals"
command_exit = "tooltrace.scoring.builtin:_command_exit"
tests_pass = "tooltrace.scoring.builtin:_tests_pass"
git_diff = "tooltrace.scoring.builtin:_git_diff"
ast_check = "tooltrace.scoring.builtin:_ast_check"
data_equals = "tooltrace.scoring.builtin:_data_equals"
api_state = "tooltrace.scoring.builtin:_api_state"
ast_unrelated_edits = "tooltrace.scoring.builtin:_ast_unrelated_edits"
json_set_equals = "tooltrace.scoring.builtin:_json_set_equals"

[project.entry-points."tooltrace.reporters"]
json_report = "tooltrace.exporters:json_report"
csv_report = "tooltrace.exporters:csv_report"
markdown_report = "tooltrace.exporters:markdown_report"
junit_report = "tooltrace.exporters:junit_report"
html_report = "tooltrace.exporters:html_report"

# pytest integration: auto-registered when tooltrace-bench is installed.
[project.entry-points.pytest11]
tooltrace = "tooltrace.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["tooltrace"]

# The schemas are authored once at the repository root, and copied into the
# wheel so an installed package carries its own. Without this the wheel shipped
# no schemas at all and every task load raised "task.schema.json not found";
# scripts/wheel_check.py builds a wheel and proves the copy arrives.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "tooltrace/schema_data"

[tool.hatch.build.targets.sdist]
include = ["tooltrace", "schemas", "tests", "docs", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tooltrace", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = false
show_error_codes = true
files = ["tooltrace"]

[[tool.mypy.overrides]]
module = ["jsonschema.*", "yaml.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["tooltrace"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]

[tool.ruff.lint.per-file-ignores]
# Same shared-script situation: the gh endpoint is built from the hardcoded
# REPOS list above it, not from user input.
"scripts/fetch_competitor_meta.py" = ["S603", "S607", "RUF100"]
# Shared verbatim across the four sibling repositories, whose ruff rule
# sets differ: S310 must be suppressed where it is enabled, and that
# suppression must not read as unused (RUF100) where it is not.
"scripts/check_action_pins.py" = ["S310", "RUF100"]
