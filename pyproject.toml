[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tooltrace-bench"
version = "0.1.0"
description = "Vendor-neutral, reproducible benchmarking of AI agents across coding, tool use, file operations, multi-step workflows, failure recovery, latency, cost and reliability."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "webdevsamran", email = "webdevsamran@users.noreply.github.com" }]
maintainers = [{ name = "webdevsamran", email = "webdevsamran@users.noreply.github.com" }]
keywords = [
  "ai-agents", "benchmark", "evaluation", "llm", "tool-use",
  "reliability", "reproducibility", "tracing", "sandbox",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "jsonschema>=4.21,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
docker = ["docker>=7.0,<8"]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<7",
  "hypothesis>=6.100,<7",
  "mypy>=1.10,<2",
  "ruff>=0.4,<1",
  "types-PyYAML>=6.0",
]

[project.scripts]
tooltrace = "tooltrace.cli.main:main"

[project.urls]
Homepage = "https://github.com/webdevsamran/tooltrace-bench"
Repository = "https://github.com/webdevsamran/tooltrace-bench"
Issues = "https://github.com/webdevsamran/tooltrace-bench/issues"
Documentation = "https://github.com/webdevsamran/tooltrace-bench/tree/main/docs"

# Plugin discovery groups. Third-party packages may register:
#   tooltrace.agents       -> AgentAdapter implementations
#   tooltrace.tools        -> Tool implementations
#   tooltrace.task_packs   -> bundled task pack directories
#   tooltrace.scorers      -> deterministic scorers
#   tooltrace.reporters    -> report exporters
#   tooltrace.sandboxes    -> sandbox providers
[project.entry-points."tooltrace.agents"]
subprocess = "tooltrace.agents.subprocess:SubprocessAgent"
openai_compat = "tooltrace.agents.openai_compat:OpenAICompatAgent"
scripted = "tooltrace.agents.scripted:ScriptedAgent"

[project.entry-points."tooltrace.sandboxes"]
local = "tooltrace.sandbox.local:TempWorkspaceSandbox"
docker = "tooltrace.sandbox.docker_sandbox:DockerSandbox"

[tool.hatch.build.targets.wheel]
packages = ["tooltrace"]

[tool.hatch.build.targets.sdist]
include = ["tooltrace", "schemas", "tests", "docs", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tooltrace", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = false
show_error_codes = true
files = ["tooltrace"]

[[tool.mypy.overrides]]
module = ["jsonschema.*", "yaml.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["tooltrace"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]