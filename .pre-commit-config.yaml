# Pre-commit hooks for ToolTrace Bench.
# Install: pre-commit install && pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4  # the version "[dev]" resolves to; keep them in step
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        types: [python]
        files: ^tooltrace/
      - id: no-secrets
        name: block likely secrets
        entry: python -m tooltrace.security.scan_repo
        language: system
        pass_filenames: false
      # A prompt is code. Changing the system prompt or a tool description
      # changes what every agent sees and what every score means, and it is the
      # one edit that passes ruff, mypy and the whole test suite while silently
      # invalidating a baseline. This does not block the change -- it says out
      # loud that the comparison to yesterday's numbers no longer holds.
      - id: prompt-changed
        name: warn when an agent prompt or tool description changes
        entry: python scripts/prompt_change_notice.py
        language: system
        files: ^(tooltrace/agents/chat_base\.py|tooltrace/agents/tool_schemas\.py|tooltrace/tools/.*\.py)$