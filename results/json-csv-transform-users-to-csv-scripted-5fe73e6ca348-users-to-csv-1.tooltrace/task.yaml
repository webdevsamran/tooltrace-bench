schema_version: 1
id: json-csv-transform/users-to-csv
version: 1.0.0
category: json-csv-transform
objective: Convert users.json into users.csv with a header row name,age.
description: Read users.json and write users.csv with columns name,age in the same
  order.
starting_workspace:
  users.json: '[{"name": "Ada", "age": 36}, {"name": "Lin", "age": 28}]'
fixtures: {}
allowed_tools:
- read_file
- write_file
- list_directory
assertions:
- type: file_exists
  params:
    path: users.csv
  weight: 1.0
  description: csv created
- type: csv_equals
  params:
    path: users.csv
    expected_csv: 'name,age

      Ada,36

      Lin,28

      '
  weight: 1.0
  description: csv content exact
timeout_seconds: 60.0
max_steps: 10
network_policy: disabled
resource_limits:
  max_memory_mb: null
  max_cpus: null
  max_disk_mb: null
difficulty: easy
tags:
- json
- csv
perturbations: []
long_context: false
metadata:
  scripted_script:
  - tool: write_file
    args:
      path: users.csv
      content: 'name,age

        Ada,36

        Lin,28

        '
