schema_version: 1
id: failure-recovery/retry-after-tool-failure
version: 1.0.0
category: failure-recovery
objective: Fix the typo in notes.txt even though the first read_file call fails transiently.
description: The harness injects one transient failure into the first read_file call.
  A reliable agent retries and completes.
starting_workspace:
  notes.txt: 'deploy is reday

    '
fixtures: {}
allowed_tools:
- read_file
- patch_file
- write_file
assertions:
- type: file_not_contains
  params:
    path: notes.txt
    text: reday
  weight: 1.0
  description: typo fixed
- type: file_contains
  params:
    path: notes.txt
    text: ready
  weight: 1.0
  description: correct word
timeout_seconds: 60.0
max_steps: 10
network_policy: disabled
resource_limits:
  max_memory_mb: null
  max_cpus: null
  max_disk_mb: null
difficulty: medium
tags:
- recovery
- perturbation
perturbations:
- kind: tool_failure
  params:
    tool: read_file
  apply_at_step: null
long_context: false
metadata:
  scripted_script:
  - tool: read_file
    args:
      path: notes.txt
  - tool: read_file
    args:
      path: notes.txt
  - tool: patch_file
    args:
      path: notes.txt
      search: reday
      replace: ready
