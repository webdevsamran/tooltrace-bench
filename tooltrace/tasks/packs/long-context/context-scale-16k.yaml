allowed_tools:
- read_file
- patch_file
- search_text
- list_directory
assertions:
- type: file_not_contains
  params:
    path: target.txt
    text: reday
  weight: 1.0
  description: typo fixed
- type: file_contains
  params:
    path: target.txt
    text: ready
  weight: 1.0
  description: correct word
expected_artifacts: []
timeout_seconds: 60
max_steps: 12
network_policy: disabled
long_context: true
metadata:
  context_chars: 16000
  scripted_script:
  - tool: search_text
    args:
      pattern: reday
  - tool: patch_file
    args:
      path: target.txt
      search: reday
      replace: ready
