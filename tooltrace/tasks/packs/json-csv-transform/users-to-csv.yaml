id: json-csv-transform/users-to-csv
name: Convert users.json to users.csv
category: json-csv-transform
tags:
- json
- csv
objective: Convert users.json into users.csv with a header row name,age.
description: Read users.json and write users.csv with columns name,age in the same
  order.
starting_workspace:
  users.json: '[{"name": "Ada", "age": 36}, {"name": "Lin", "age": 28}]'
allowed_tools:
- read_file
- write_file
- list_directory
assertions:
- type: file_exists
  params:
    path: users.csv
  weight: 1.0
  description: csv created
- type: csv_equals
  params:
    path: users.csv
    expected_csv: 'name,age

      Ada,36

      Lin,28

      '
  weight: 1.0
  description: csv content exact
expected_artifacts:
- users.csv
metadata:
  scripted_script:
  - tool: write_file
    args:
      path: users.csv
      content: 'name,age

        Ada,36

        Lin,28

        '
version: 1.0.0
difficulty: easy
network_policy: disabled
timeout_seconds: 60
max_steps: 10
