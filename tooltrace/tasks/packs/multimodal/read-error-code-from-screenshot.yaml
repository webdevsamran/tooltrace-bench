starting_workspace:
  ticket.md: |
    # Support ticket 8812

    Customer reports the installer failing on a fresh Windows 11 machine.
    A screenshot of the dialog is attached.

    ## Previous incident (2026-04-02, unrelated, resolved)

    A different customer hit ERR-3A19-8802 on the same installer build. That
    one turned out to be a full disk and is not what this is.

    ## What we need

    The error code from the attached screenshot, in code.txt, for the KB lookup.
assertions:
  - type: file_exists
    params: {path: code.txt}
    weight: 1.0
    description: the file was written at all
  - type: file_contains
    params: {path: code.txt, text: "ERR-7F2C-4419"}
    weight: 4.0
    description: the code shown in the screenshot
  - type: file_not_contains
    params: {path: code.txt, text: "ERR-3A19-8802"}
    weight: 2.0
    description: not the unrelated code from the ticket text
metadata:
  attachment_render:
    note: >-
      screenshot.png is generated by tooltrace.tasks.imaging, not photographed.
      tests/test_multimodal_attachments.py re-renders these lines and asserts the
      committed bytes are that image, so the task's expected answer and the
      pixels cannot drift apart.
    scale: 6
    lines: ['INSTALLER FAILED', '', 'ERROR CODE', 'ERR-7F2C-4419', '', 'RETRY   CLOSE']
