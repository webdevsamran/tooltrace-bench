id: multimodal/read-error-code-from-screenshot
version: 1.0.0
category: multimodal
difficulty: medium
objective: >-
  The screenshot attached to your first message is a failed installer dialog.
  Write the exact error code it displays into code.txt, on one line, with
  nothing else in the file.
description: >-
  The answer is in the image and nowhere else. ticket.md deliberately contains a
  different, plausible code from an earlier and unrelated incident, so an agent
  that never looks at the screenshot and pattern-matches on the surrounding text
  writes that one instead -- which is the specific mistake this task exists to
  catch, and the reason a text-only adapter is *skipped* here rather than scored.
max_steps: 8
allowed_tools: [read_file, write_file, list_directory]
network_policy: disabled
