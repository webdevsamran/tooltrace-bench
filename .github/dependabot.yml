version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    groups:
      python-dev:
        dependency-type: "development"
      python-runtime:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "frontend"]
    groups:
      frontend:
        patterns: ["*"]

  # Grouped so all action bumps land in ONE branch/PR instead of one per action.
    ignore:
      # TypeScript 7 is not installable here yet: typescript-eslint declares
      # `peer typescript@">=4.8.4 <6.1.0"`, and 8.69.0 is its latest release,
      # so `npm ci` fails with ERESOLVE before anything compiles. Dependabot
      # reopens this bump as soon as it is declined and will keep doing so
      # weekly. Remove once a typescript-eslint release supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns: ["*"]