version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    groups:
      python-dev:
        dependency-type: "development"
      python-runtime:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "frontend"]
    groups:
      frontend:
        patterns: ["*"]

  # Grouped so all action bumps land in ONE branch/PR instead of one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns: ["*"]