name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python lint · type · test · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check tooltrace scripts tests
      - name: Format check (ruff format)
        run: ruff format --check tooltrace scripts tests
      - name: Type check (mypy)
        run: mypy tooltrace
      - name: Test + coverage
        run: pytest --cov=tooltrace --cov-report=term-missing --cov-fail-under=80
      - name: Validate schemas + task packs
        run: |
          python -m json.tool schemas/task-v1.json > /dev/null
          python -m json.tool schemas/trace-v1.json > /dev/null
          python -m json.tool schemas/result-bundle-v1.json > /dev/null
          tooltrace validate --path tooltrace/tasks/packs --json
      - name: Deterministic sample evaluation
        run: python scripts/make_sample_results.py
      - name: CLI smoke test
        run: python scripts/cli_smoke.py
      - name: Sandbox cleanup check
        run: python scripts/sandbox_check.py
      - name: Secret scan (publication gate)
        run: python scripts/secret_scan.py
      - name: Generate static web data
        run: python scripts/generate_web_data.py
      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -o sbom.json --no-validate || python scripts/generate_sbom.py
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: results-and-webdata
          path: |
            results/
            web/public/data/

  frontend:
    name: Frontend lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --version || true
      - name: Audit Python deps (non-blocking advisory listing)
        run: pip-audit -r <(pip freeze) || echo "::warning::pip-audit findings above"
        shell: bash