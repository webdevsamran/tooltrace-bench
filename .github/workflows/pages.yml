name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python@v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Generate validated sample results (real bundles only)
        run: python scripts/make_sample_results.py
      - name: Generate static web data from verified bundles
        run: python scripts/generate_web_data.py
      # actions/setup-node@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # actions/configure-pages@v5
      # Before the build, not after: it is what tells the build the project
      # subpath. The site previously built with a relative asset base, so
      # every nested route (a result, a task, a failing step) asked for its
      # JavaScript from under that route, 404'd, and never booted.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        id: pages
      - name: Build frontend
        working-directory: web
        env:
          TTB_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build
      - name: Fail if the SPA fallback is missing
        # Pages has no router: without 404.html it answers its own 404 page and
        # every deep link is dead, silently and only in production.
        run: test -f web/dist/404.html
      # actions/upload-pages-artifact@v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # actions/deploy-pages@v5
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
