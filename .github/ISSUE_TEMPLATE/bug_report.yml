name: Bug report
description: Report a reproducible problem in ToolTrace Bench
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include sanitized
        output only — never paste secrets, API keys or private paths.
  - type: input
    id: version
    attributes:
      label: ToolTrace Bench version
      placeholder: "0.1.0 (pip show tooltrace-bench)"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and its `--json` output if available.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker availability.
      placeholder: "Windows 11, Python 3.12.3, Docker 27"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have removed all secrets/private data from the output above
          required: true
        - label: I searched existing issues for duplicates
          required: true